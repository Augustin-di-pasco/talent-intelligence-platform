services:
  - type: web
    name: zerilys-platform
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: node --check apply-zerilys-polish.mjs && node --check zerilys-audit-remediation.mjs && node --check zerilys-profile-audit.mjs && node --check zerilys-billing/install.mjs && unzip -oq ZERILYS.zip && node apply-zerilys-polish.mjs zeri_work18 && node zerilys-billing/install.mjs zeri_work18 && cp .env.example .env.production.example zeri_work18/ && cd zeri_work18 && node --check src/server.js && node --check src/billing.js && node --check public/app.js && node --test && npm install --omit=dev --no-audit --no-fund
    startCommand: cd zeri_work18 && npm start
    healthCheckPath: /api/health
    disk:
      name: zerilys-data
      mountPath: /opt/render/project/src/zeri_work18/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ZERIHLINK_DATA_DIR
        value: /opt/render/project/src/zeri_work18/data
      - key: ZERIHLINK_BACKUP_RETENTION
        value: "14"
      - key: ZERIHLINK_TRUST_PROXY
        value: "true"
      - key: ZERIHLINK_SESSION_SECRET
        generateValue: true
      - key: ZERIHLINK_ALLOW_SIGNUP
        value: "false"
      - key: ZERIHLINK_BETA_LEGAL_APPROVED
        value: "false"
      - key: ZERIHLINK_PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_BILLING_ENABLED
        value: "false"
